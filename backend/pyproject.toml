[project]
name = "axelcompta"
version = "0.0.1"
description = "Moteur comptable AxeLCompta — squelette bout-en-bout (doc 17 semaine 0)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "reportlab>=4.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "types-reportlab",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["axelcompta*"]

# --- Typage : mypy strict sur tout le code, sans exception par module (doc 08 §3) ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

# joblib n'a ni py.typed ni stubs publiés (types-joblib n'existe pas) —
# justification requise pour toute suppression de type (doc 08 §3).
[[tool.mypy.overrides]]
module = "joblib"
ignore_missing_imports = true

# --- Lint + format : ruff (doc 08 §3) ---
[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions/ : généré par `alembic revision --autogenerate`, jamais
# édité à la main — pas soumis à notre style (imports, X|Y...).
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# PLR0915 = too-many-statements : proxy le plus proche disponible nativement
# dans ruff pour la règle doc 08 §1 « fonctions ≤ 60 lignes » (des lignes, pas
# des statements — c'est pourquoi tests/test_code_quality.py fait aussi une
# vérification exacte au nombre de lignes, en plus de ce garde-fou).
select = ["E", "F", "I", "UP", "B", "C90", "PLR0915"]
mccabe.max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60

# --- Frontières entre modules : reproduit les règles de dépendance du doc 03 §3 ---
# et de backend/README.md. Un contrat cassé = CI rouge (doc 08 §4).
[tool.importlinter]
root_package = "axelcompta"

[[tool.importlinter.contracts]]
name = "ledger ne dépend que de core"
type = "forbidden"
source_modules = ["axelcompta.ledger"]
forbidden_modules = [
    "axelcompta.tenants",
    "axelcompta.packs",
    "axelcompta.ingestion",
    "axelcompta.documents",
    "axelcompta.categorize",
    "axelcompta.anomaly",
    "axelcompta.closing",
    "axelcompta.filings",
    "axelcompta.workflow",
    "axelcompta.api",
    "axelcompta.ml",
]

[[tool.importlinter.contracts]]
name = "categorize ne parle jamais directement à ledger (doit passer par workflow)"
type = "forbidden"
source_modules = ["axelcompta.categorize"]
forbidden_modules = ["axelcompta.ledger", "axelcompta.closing", "axelcompta.filings"]

[[tool.importlinter.contracts]]
name = "personne n'importe ml au runtime (artefact chargé, jamais importé)"
type = "forbidden"
source_modules = [
    "axelcompta.core",
    "axelcompta.tenants",
    "axelcompta.packs",
    "axelcompta.ingestion",
    "axelcompta.documents",
    "axelcompta.categorize",
    "axelcompta.anomaly",
    "axelcompta.ledger",
    "axelcompta.closing",
    "axelcompta.filings",
    "axelcompta.workflow",
    "axelcompta.api",
]
forbidden_modules = ["axelcompta.ml"]

[[tool.importlinter.contracts]]
name = "api n'importe que les façades publiques (pas les internes des modules)"
type = "forbidden"
source_modules = ["axelcompta.api"]
forbidden_modules = [
    "axelcompta.ledger.models",
    "axelcompta.categorize.models",
    "axelcompta.closing.models",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite un vrai Postgres (`docker compose up -d db`), doc 09 §4",
]
# importlib (plutôt que le mode "prepend" par défaut) : permet des noms de
# fichiers de test identiques dans des dossiers différents (tests/ miroir de
# axelcompta/, doc 08 §3) sans nécessiter de __init__.py dans chaque dossier.
# -m "not integration" : la suite rapide par défaut (doc 08 §4 étape 5) ne
# dépend jamais d'un Postgres démarré ; l'intégration (étape 6) se lance à
# part avec `pytest -m integration`.
addopts = '--import-mode=importlib -m "not integration"'
