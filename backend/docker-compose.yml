
services:
  # Postgres minimal, un seul schéma (doc 17 §3 : pas de multi-tenant/RLS pour
  # la démo). Identifiants alignés sur .env.example — `cp .env.example .env`
  # à la racine du repo, puis `docker compose up -d db`, marche sans rien
  # changer.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axelcompta_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d axelcompta_dev"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
