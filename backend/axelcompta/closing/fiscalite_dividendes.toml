# Imposition des dividendes perçus par une personne physique, par année de
# versement. Données versionnées : un nouveau millésime s'ajoute ici.
#
# - pfu_impot_revenu : part impôt sur le revenu du prélèvement forfaitaire
#   unique, 12,8 % (CGI art. 200 A ; brochure DGFiP « Principales
#   nouveautés revenus 2025 »).
# - prelevements_sociaux : CSG + CRDS + prélèvement de solidarité. 18,6 % à
#   partir du 1er janvier 2026 (CSG 10,6 %, CRDS 0,5 %, solidarité 7,5 %),
#   loi n° 2025-1403 du 30 décembre 2025 (LFSS 2026), art. 12 ; 17,2 %
#   avant. Source : service-public.gouv.fr, fiche F2329.
# - seuil_tns_capital : part des dividendes d'un gérant majoritaire (EURL,
#   SARL) soumise aux cotisations des travailleurs non salariés au-delà de
#   10 % du capital, des primes et des comptes courants (CSS art. L131-6).

[annees.2025]
pfu_impot_revenu_pct = "12.8"
prelevements_sociaux_pct = "17.2"
seuil_tns_capital_pct = "10"

[annees.2026]
pfu_impot_revenu_pct = "12.8"
prelevements_sociaux_pct = "18.6"
seuil_tns_capital_pct = "10"
