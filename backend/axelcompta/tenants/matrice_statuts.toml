# Matrice statut × régime (doc 06 §7) : la configuration fiscale d'un dossier
# se lit ici, jamais dans des `if forme == "SASU"` éparpillés dans le code.
# Ajouter un statut, c'est ajouter des données ici (et ses formulaires), pas
# une migration. Toute modification change `version`.

version = "2026-09-27"

# Une colonne de la matrice = un traitement comptable et fiscal.
# - disponible : le moteur sait produire ses comptes et sa liasse de bout en bout.
# - impot : "IS" (la société paie), "IR" (le résultat remonte chez l'exploitant
#   ou les associés), "micro" (pas de résultat comptable, abattement forfaitaire).
# - compte_usage_personnel : où va une dépense personnelle détectée ; absent =
#   signalée sans écriture.
# - associes : la déclaration liste les associés et le capital (2031-bis
#   cadre E, 2033-F) ; faux pour l'exploitant d'une entreprise individuelle.

[colonnes.societe_is]
libelle = "Société à l'IS"
disponible = true
entite = "la société"
comptabilite = "engagement"
impot = "IS"
formulaires_resultat = ["2065", "2033"]
depot_comptes_inpi = true
compte_usage_personnel = "455"
associes = true

[colonnes.societe_ir]
libelle = "Société à l'IR"
# 2031 + 2033 produites depuis le 2026-09-26 (filings/cerfa_2031.py).
disponible = true
entite = "la société"
comptabilite = "engagement"
impot = "IR"
formulaires_resultat = ["2031", "2033"]
depot_comptes_inpi = true
compte_usage_personnel = "455"
associes = true

[colonnes.ei_reel]
libelle = "Entreprise individuelle au réel"
# 2031 + 2033 depuis le 2026-09-26, bilan de l'exploitant (108 en capital
# individuel, pas de 2033-F).
disponible = true
entite = "l'exploitant"
comptabilite = "engagement"
impot = "IR"
formulaires_resultat = ["2031", "2033"]
depot_comptes_inpi = false
compte_usage_personnel = "108"
associes = false

[colonnes.micro]
libelle = "Micro-entreprise"
disponible = false
entite = "l'exploitant"
comptabilite = "livre_recettes"
impot = "micro"
formulaires_resultat = ["2042-C-PRO"]
depot_comptes_inpi = false
associes = false

# Combinaisons (forme juridique, régime d'imposition) admises, et leur colonne.
# - option_IR : option temporaire (art. 239 bis AB CGI), bornée à 5 exercices,
#   exige `option_ir_debut`.
# - IR : IR sans limite de durée (EURL dont l'associé unique est une personne
#   physique, SARL de famille, entreprise individuelle).
[[combinaisons]]
forme = "SASU"
regime = "IS"
colonne = "societe_is"

[[combinaisons]]
forme = "SAS"
regime = "IS"
colonne = "societe_is"

[[combinaisons]]
forme = "EURL"
regime = "IS"
colonne = "societe_is"

[[combinaisons]]
forme = "SARL"
regime = "IS"
colonne = "societe_is"

[[combinaisons]]
forme = "SASU"
regime = "option_IR"
colonne = "societe_ir"

[[combinaisons]]
forme = "SAS"
regime = "option_IR"
colonne = "societe_ir"

[[combinaisons]]
forme = "SARL"
regime = "option_IR"
colonne = "societe_ir"

[[combinaisons]]
forme = "EURL"
regime = "IR"
colonne = "societe_ir"

[[combinaisons]]
forme = "SARL"
regime = "IR"
colonne = "societe_ir"

[[combinaisons]]
forme = "EI"
regime = "IR"
colonne = "ei_reel"

[[combinaisons]]
forme = "EI"
regime = "micro"
colonne = "micro"

# Rémunération du dirigeant, catégorisée par le chauffeur lui-même (Louis,
# 2026-09-26) : le compte dépend de la forme, pas de la colonne.
# - SASU, SAS : président assimilé salarié. Son virement net solde la paie
#   due (421), passée depuis son bulletin (`closing/paie.py` : 641 brut, 645
#   charges patronales, 431 cotisations, 4421 prélèvement à la source) ;
# - EURL : gérant associé unique, donc majoritaire, travailleur non salarié, 644 ;
# - EI : prélèvement de l'exploitant, 108 (pas une charge).
# SARL absente exprès : 644 si le gérant est majoritaire, 641 sinon ; on le
# demande plutôt que de le deviner.
[remuneration_dirigeant]
SASU = "421"
SAS = "421"
EURL = "644"
EI = "108"

# Cotisations sociales du dirigeant payées à l'URSSAF, catégorisées par le
# chauffeur : dette de cotisations (431) pour le président assimilé salarié,
# qui naît de son bulletin ; charge de l'exploitant ou du gérant non salarié
# (646) sinon. SARL absente pour la même raison que plus haut.
[cotisations_dirigeant]
SASU = "431"
SAS = "431"
EURL = "646"
EI = "646"
