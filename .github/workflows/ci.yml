name: CI

# Barrière de qualité (doc 12 §1.1, doc 08 §4) — bloquante sur chaque PR
# vers main et sur chaque push à main. Couvre ruff / mypy / import-linter /
# pytest rapide + intégration Postgres / lint+build front.
#
# Volontairement pas encore : seuils de couverture, audit deps/secrets,
# build Docker (doc 08 §4 étapes 7-10). Les tests `supabase` restent hors
# CI (quota e-mail réel — backend/README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axelcompta_dev
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d axelcompta_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/axelcompta_dev
      DATABASE_URL_WEB: postgresql://axelcompta_web:web_password_dev@localhost:5432/axelcompta_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Installer axelcompta (+ deps dev)
        run: pip install -e ".[dev]"

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: ruff check
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy axelcompta tests migrations

      - name: import-linter (frontières de modules, doc 03 §3)
        run: lint-imports

      - name: Migrations Alembic (vers le Postgres du job)
        run: python -m alembic upgrade head

      - name: Tests rapides (hors Postgres / Supabase)
        # Explicit marker — ne pas dépendre seulement de addopts pyproject.
        run: python -m pytest -m "not integration and not supabase"

      - name: Tests d'intégration (vrai Postgres)
        run: python -m pytest -m integration

  frontend:
    name: frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: next lint
        run: npm run lint

      - name: Build (type-check tsc inclus)
        run: npm run build
